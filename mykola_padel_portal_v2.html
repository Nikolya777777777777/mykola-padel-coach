body::after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(0,0,0,.05),rgba(0,0,0,.5) 75%);z-index:0}
.card{width:min(430px,100%);position:relative;z-index:1;text-align:center;padding:30px 21px 25px;border:1px solid rgba(255,255,255,.2);border-radius:30px;background:rgba(8,9,11,.53);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 25px 90px rgba(0,0,0,.55)}
.avatar{width:104px;height:104px;margin:0 auto 16px;border-radius:50%;padding:3px;background:rgba(255,255,255,.9);box-shadow:0 10px 35px rgba(0,0,0,.5)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
h1{font-size:27px;line-height:1.1;margin:0 0 7px;letter-spacing:-.7px;text-shadow:0 2px 15px #000}
.handle{font-size:14px;color:#ddd;margin-bottom:9px}
.bio{font-size:14px;line-height:1.45;color:#eee;margin:0 auto 25px}
.links{display:flex;flex-direction:column;gap:12px}
a{display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;color:#fff;font-weight:700;font-size:16px;padding:17px 20px;border-radius:17px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.13);box-shadow:0 8px 25px rgba(0,0,0,.2);transition:transform .2s,background .2s}
a:hover{transform:translateY(-2px);background:rgba(255,255,255,.21)}
.icon{width:24px;height:24px;display:grid;place-items:center;font-size:20px}
.footer{margin-top:22px;color:rgba(255,255,255,.62);font-size:10px;letter-spacing:1.8px;text-transform:uppercase}
</style>
</head>
